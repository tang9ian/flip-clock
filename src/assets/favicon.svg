<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- Top flip card -->
  <rect x="6" y="8" width="20" height="7" rx="2" fill="#303135" stroke="#666" stroke-width="0.5"/>
  
  <!-- Bottom flip card -->
  <rect x="6" y="17" width="20" height="7" rx="2" fill="#414147" stroke="#666" stroke-width="0.5"/>
  
  <!-- Time display "12" -->
  <text x="16" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">12</text>
  
  <!-- Center line -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="#000" stroke-width="1"/>
  
  <!-- Rivets -->
  <circle cx="8" cy="16" r="1" fill="#555"/>
  <circle cx="24" cy="16" r="1" fill="#555"/>
</svg>
